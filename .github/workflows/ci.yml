name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # match .python-version; a skew forks the uv.lock resolution
          python-version: "3.12.11"
          enable-cache: true

      - name: Sync environment (uv.lock)
        run: uv sync --locked

      - name: Ruff lint (78 cols, pydocstyle, perflint, E741)
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy

      # The @slow bucket (calibration battery, the ~140s module-demo
      # meta-test) runs in its own retryable step below — the default
      # path stays fast WITHOUT dropping slow coverage entirely.
      - name: Pytest (fast)
        run: uv run pytest -m "not slow" --tb=short -q

      - name: Pytest (slow bucket)
        run: uv run pytest -m slow --tb=short -q

      - name: Ensemble pipeline smoke test (self-verifying demo)
        run: uv run python -m atropos.ensemble_pipeline

      - name: Track-record demo smoke test (four live fates)
        run: uv run python -m atropos.track_record

  real-data-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # match .python-version; a skew forks the uv.lock resolution
          python-version: "3.12.11"
          enable-cache: true

      - name: Sync environment (uv.lock)
        run: uv sync --locked

      # offline by design: reads the committed SPY snapshot, prints the
      # frozen prereg, then the walk-forward verdicts (expected ~3s)
      - name: Real-data example (SPY 12-1 TSMOM, --quick)
        run: uv run python examples/real_data/run_example.py --quick

  # WITH-extras leg of the test matrix: lightgbm (the optional
  # "ranking" extra) installed.  The ranking suite passes without the
  # extra too (the lambdarank tests importorskip it), so this job
  # covers the oracle path the default sync leaves skipped.
  ranking-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          # match .python-version; a skew forks the uv.lock resolution
          python-version: "3.12.11"
          enable-cache: true

      - name: Sync environment (uv.lock + ranking extra)
        run: uv sync --locked --extra ranking

      - name: Ranking suite (lightgbm lambdarank oracle included)
        run: uv run python -m pytest tests/test_ranking.py --tb=no -q

      # rot-proof demo smoke: tests/test_ci_smoke.py discovers EVERY
      # atropos module with a __main__ guard and runs each as
      # `python -m atropos.<module>` (exit 0 asserted), so the demo
      # set cannot silently shrink or grow unseen.  Also runs with the
      # extra installed -- the ranking demo itself needs no lightgbm.
      - name: Module-demo smoke (discover + run every __main__ module)
        run: uv run python -m pytest tests/test_ci_smoke.py --tb=short -q

  pdoc-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.11"
          enable-cache: true

      - name: Sync environment (uv.lock)
        run: uv sync --locked

      # the committed docs/api HTML must match the docstrings: regen
      # into a temp dir and diff -- a stale reference is a red CI
      - name: Regenerate pdoc reference into a temp dir
        run: |
          uv run --with pdoc==16.0.0 python -m pdoc \
            atropos atropos._utils atropos.adapters atropos.agent \
            atropos.backtesting atropos.bootstrap_ci atropos.book \
            atropos.cli atropos.cost_model atropos.cross_sectional \
            atropos.data_contract atropos.ensemble_pipeline \
            atropos.evaluation_metrics atropos.feature_scan \
            atropos.incremental_regression atropos.kill_chain \
            atropos.legs atropos.ml_ensemble atropos.ml_training \
            atropos.monte_carlo atropos.null_control_suite \
            atropos.orthogonal atropos.portfolio \
            atropos.portfolio_protocol atropos.power_calculator \
            atropos.predictive_model_eval atropos.prereg_generator \
            atropos.robustness_battery atropos.ranking atropos.strategy \
            atropos.track_record atropos.walkforward_framework \
            atropos.workspace -o /tmp/pdoc_ci

      - name: Diff regenerated reference against committed docs/api
        run: diff -r /tmp/pdoc_ci/atropos docs/api/atropos
